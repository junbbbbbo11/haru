{# 섹션별 아이콘 — 직접 그린 선 SVG. currentColor로 섹션 색을 따라간다. #}
{% macro icon(id, size=28) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if id == "domestic" %}
  <path d="M4 27h24M6 27V14M26 27V14M11 27V14M16 27V14M21 27V14M3 14h26L16 5z"/>
{% elif id == "world" %}
  <circle cx="16" cy="16" r="11"/><ellipse cx="16" cy="16" rx="4.6" ry="11"/><path d="M5 16h22M7 10h18M7 22h18"/>
{% elif id == "economy" %}
  <path d="M4 27h24M4 27V5"/><path d="M8 22l6-6 4 4 9-10"/><path d="M22 10h5v5"/>
{% elif id == "tech" %}
  <rect x="9" y="9" width="14" height="14" rx="1.5"/><rect x="13" y="13" width="6" height="6"/><path d="M13 9V5M19 9V5M13 27v-4M19 27v-4M9 13H5M9 19H5M27 13h-4M27 19h-4"/>
{% elif id == "fashion" %}
  <path d="M16 9.5a2.5 2.5 0 1 1 2.5-2.5c0 1.4-2.5 2-2.5 4"/><path d="M16 11L3.5 21.5c-.8.7-.3 1.5.7 1.5h23.6c1 0 1.5-.8.7-1.5z"/>
{% elif id == "beauty" %}
  <path d="M12 14l1.5-8.5c.2-1 1.6-1.4 2.4-.6l3 3c.4.4.6 1 .6 1.5V14"/><rect x="10" y="14" width="12" height="5"/><rect x="9" y="19" width="14" height="9" rx="1"/>
{% elif id == "lifestyle" %}
  <path d="M6 12h17v7a7 7 0 0 1-7 7h-3a7 7 0 0 1-7-7z"/><path d="M23 14h2a3 3 0 0 1 0 6h-2.5"/><path d="M11 4c-1 1.5 1 2.5 0 4M15.5 4c-1 1.5 1 2.5 0 4M20 4c-1 1.5 1 2.5 0 4"/>
{% elif id == "culture" %}
  <rect x="4" y="6" width="24" height="20" rx="1"/><rect x="7.5" y="9.5" width="17" height="13"/><path d="M7.5 22.5l5-6 3.5 4 3-3 5.5 5"/><circle cx="19.5" cy="13.5" r="1.5"/>
{% elif id == "sports" %}
  <circle cx="16" cy="16" r="11"/><path d="M8.5 8c3 2.5 3 13.5 0 16M23.5 8c-3 2.5-3 13.5 0 16"/>
{% elif id == "quote" %}
  <path d="M6 20c0-5 2-9 7-11M6 20a3.5 3.5 0 1 0 7 0 3.5 3.5 0 0 0-7 0zM18 20c0-5 2-9 7-11M18 20a3.5 3.5 0 1 0 7 0 3.5 3.5 0 0 0-7 0z"/>
{% elif id == "fortune" %}
  <path d="M16 3l2.6 7.4H26l-6 4.6 2.3 7.5L16 18l-6.3 4.5L12 15 6 10.4h7.4z"/><path d="M16 26v3M10 27l-1 2M22 27l1 2"/>
{% elif id == "chart" %}
  <path d="M4 26h24M7 26V16M13 26V10M19 26V18M25 26V6"/>
{% elif id == "ootd" %}
  <path d="M16 9.5a2.5 2.5 0 1 1 2.5-2.5c0 1.4-2.5 2-2.5 4"/><path d="M16 11L3.5 21.5c-.8.7-.3 1.5.7 1.5h23.6c1 0 1.5-.8.7-1.5z"/><path d="M9 27h14"/>
{% else %}
  <circle cx="16" cy="16" r="10"/>
{% endif %}
</svg>
{%- endmacro %}

{# OOTD 플랫레이용 옷 실루엣 — 추천 색(hex)으로 채우고 얇은 선으로 윤곽 #}
{% macro garment(cat, hex) -%}
<svg class="garment" viewBox="0 0 100 100" aria-hidden="true" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
{% if cat == "outer" %}
  <path fill="{{ hex }}" d="M31 13 42 9 50 20 58 9 69 13 86 30 79 41 73 37 73 93H27V37L21 41 14 30Z"/>
  <path fill="none" d="M42 9 50 42 58 9M50 42V93M27 60h8M65 60h8"/>
  <circle cx="54" cy="52" r="1.4" fill="var(--ink)"/><circle cx="54" cy="66" r="1.4" fill="var(--ink)"/>
{% elif cat == "top" %}
  <path fill="{{ hex }}" d="M35 15Q50 25 65 15L88 29 80 44 72 40V87H28V40L20 44 12 29Z"/>
  <path fill="none" d="M35 15Q50 31 65 15M28 81h44"/>
{% elif cat == "dress" %}
  <path fill="{{ hex }}" d="M39 8H61L63 27 81 92H19L37 27Z"/>
  <path fill="none" d="M37 27Q50 31 63 27M44 8Q50 16 56 8"/>
{% elif cat == "bottom" %}
  <path fill="{{ hex }}" d="M29 9H71L77 93H56L50 34 44 93H23Z"/>
  <path fill="none" d="M29 17H71M50 17V34M36 17Q36 26 30 28M64 17Q64 26 70 28"/>
{% elif cat == "shoes" %}
  <path fill="{{ hex }}" d="M10 64Q11 46 26 46L42 48Q54 59 73 61Q90 63 90 73V79H10Z"/>
  <path fill="none" d="M10 72H90M33 51l4 6M41 53l4 6"/>
{% elif cat == "bag" %}
  <path fill="none" stroke-width="2.4" d="M36 40Q36 15 50 15Q64 15 64 40"/>
  <path fill="{{ hex }}" d="M21 38H79L74 90H26Z"/>
  <path fill="none" d="M24 50H76"/>
{% elif cat == "hat" %}
  <path fill="{{ hex }}" d="M24 64Q24 30 50 30Q76 30 76 64Z"/>
  <path fill="{{ hex }}" d="M12 64H88Q88 73 79 73H21Q12 73 12 64Z"/>
  <path fill="none" d="M50 30V64"/>
{% elif cat == "scarf" %}
  <path fill="{{ hex }}" d="M30 12H70V40Q70 50 60 50H58V88H43V50H40Q30 50 30 40Z"/>
  <path fill="none" d="M30 24H70M43 76H58M45 88v5M50 88v5M55 88v5"/>
{% elif cat == "glasses" %}
  <circle cx="30" cy="52" r="15" fill="{{ hex }}" fill-opacity=".85"/><circle cx="70" cy="52" r="15" fill="{{ hex }}" fill-opacity=".85"/>
  <path fill="none" d="M45 50Q50 45 55 50M15 50 8 44M85 50 92 44"/>
{% elif cat == "umbrella" %}
  <path fill="{{ hex }}" d="M8 52Q50 0 92 52Q81 45 71 52Q61 45 50 52Q39 45 29 52Q19 45 8 52Z"/>
  <path fill="none" stroke-width="2" d="M50 52V84Q50 93 41 91"/><path fill="none" d="M50 12V18"/>
{% endif %}
</svg>
{%- endmacro %}
