  - id: culture
    name: 문화
    feeds:
      - name: 연합뉴스
        url: https://www.yna.co.kr/rss/culture.xml
      - name: 동아일보
        url: https://rss.donga.com/culture.xml
      - name: 경향신문
        url: https://www.khan.co.kr/rss/rssdata/culture_news.xml
      - name: 뉴시스
        url: https://newsis.com/RSS/culture.xml
    search:
      - 영화 개봉
      - 미술 전시 개막
      - 신간 소설

  - id: sports
    name: 스포츠
