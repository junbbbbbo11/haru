      - name: 연합뉴스
        url: https://www.yna.co.kr/rss/sports.xml
      - name: SBS 뉴스
        url: https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=09
      - name: 뉴시스
        url: https://newsis.com/RSS/sports.xml
    search: []
