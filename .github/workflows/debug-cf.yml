name: debug-cf
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: probe cloudflare payloads
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pip install -q requests
          python - <<'EOF'
          import os, requests, json
          A, T = os.environ["CLOUDFLARE_ACCOUNT_ID"], os.environ["CLOUDFLARE_API_TOKEN"]
          H = {"Authorization": f"Bearer {T}"}
          base = f"https://api.cloudflare.com/client/v4/accounts/{A}/ai/run/"
          img = "@cf/black-forest-labs/flux-1-schnell"
          from haru.lookbook import build_prompt
          look = {"items": [{"category": "outer", "en": "camel wool coat"}, {"category": "shoes", "en": "black loafers"}]}
          long_prompt = build_prompt(look, {"sky": "비"}, "a man in his 30s with an average build", "street")
          print("RES prompt length:", len(long_prompt))
          tests = [
            ("prompt only", {"prompt": "a coat"}),
            ("prompt+steps", {"prompt": "a coat", "steps": 8}),
            ("prompt+seed int", {"prompt": "a coat", "seed": 1234}),
            ("prompt+seed str", {"prompt": "a coat", "seed": "1234"}),
            ("prompt+steps+seed", {"prompt": "a coat", "steps": 8, "seed": 202610160}),
            ("real prompt only", {"prompt": long_prompt}),
            ("real prompt+steps", {"prompt": long_prompt, "steps": 8}),
          ]
          for name, body in tests:
              r = requests.post(base + img, headers=H, json=body, timeout=60)
              print(f"RES image [{name}] -> {r.status_code} {r.text[:260]}")
          # 텍스트 모델 형식 점검 (한도 소진이면 429, 형식 오류면 400)
          for model in ("@cf/openai/gpt-oss-20b",):
              for name, body in [("messages", {"messages": [{"role": "user", "content": "hi"}], "max_tokens": 50}),
                                 ("chat/completions", None)]:
                  if body is None:
                      r = requests.post(f"https://api.cloudflare.com/client/v4/accounts/{A}/ai/v1/chat/completions", headers=H,
                          json={"model": model, "messages": [{"role": "user", "content": "hi"}], "max_tokens": 50}, timeout=60)
                  else:
                      r = requests.post(base + model, headers=H, json=body, timeout=60)
                  print(f"RES text {model} [{name}] -> {r.status_code} {r.text[:260]}")
          EOF
