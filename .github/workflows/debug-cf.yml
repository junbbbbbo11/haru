name: debug-cf
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: probe cloudflare text models
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pip install -q openai requests feedparser pyyaml
          python - <<'EOF'
          import os, time, logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          from haru import collect, editor
          from haru.config import load_sources, load_config
          from haru.ai_client import _cloudflare, AIError
          src = load_sources(); cfg = load_config()["collect"]
          sec = next(s for s in src["sections"] if s["id"] == "economy")
          one = collect.collect_sections({"sections": [sec]}, cfg)[0]
          cands = one["candidates"][:25]
          user = "[섹션] 경제·금융\n\n후보:\n" + "\n".join(editor._cand_line(i, x, 200) for i, x in enumerate(cands))
          user += '\n\n화제성과 중요도가 가장 높은 이슈를 최대 2개 골라 헤드라인(25자 내외)과 요약(80자 내외)을 새로 써라.\n\nJSON 형식:\n{"items":[{"id":0,"headline":"...","summary":"..."}]}'
          acct, tok = os.environ["CLOUDFLARE_ACCOUNT_ID"], os.environ["CLOUDFLARE_API_TOKEN"]
          for model in ("@cf/openai/gpt-oss-120b", "@cf/openai/gpt-oss-20b", "@cf/meta/llama-3.3-70b-instruct-fp8-fast"):
              c = _cloudflare({}, acct, tok, 120, model)
              for tag, prefix in (("low", "Reasoning: low\n"), ("plain", "")):
                  c.system_prefix = prefix
                  t = time.time()
                  try:
                      r = c.complete_json(editor.SYSTEM, user)
                      items = r.get("items", [])
                      print(f"RES {model} [{tag}] OK {time.time()-t:.1f}s items={len(items)} usage={c.usage} | {str(items[:1])[:200]}")
                  except Exception as e:
                      print(f"RES {model} [{tag}] FAIL {time.time()-t:.1f}s {type(e).__name__}: {str(e)[:300]}")
          EOF
