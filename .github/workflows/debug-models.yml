name: debug-models
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: probe hf space
        run: |
          pip install -q gradio_client
          python - <<'EOF'
          import time
          from pathlib import Path
          from gradio_client import Client
          t = time.time()
          try:
              c = Client("black-forest-labs/FLUX.1-schnell", verbose=False)
              r = c.predict(prompt="Fashion photo cropped at the neck, a woman wearing a beige trench coat, Seoul street, 35mm film",
                            seed=1, randomize_seed=False, width=832, height=1040, num_inference_steps=4, api_name="/infer")
              out = r[0] if isinstance(r, (list, tuple)) else r
              if isinstance(out, dict): out = out.get("path")
              b = Path(out).read_bytes()
              print("HF OK", len(b), "bytes", b[:12], round(time.time() - t, 1), "s")
          except Exception as e:
              print("HF FAIL", type(e).__name__, str(e)[:400], round(time.time() - t, 1), "s")
          EOF
