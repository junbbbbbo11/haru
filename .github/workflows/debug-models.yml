name: debug-models
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with JSON {\"ok\":true}"}],"response_format":{"type":"json_object"}}'
          echo "== A: models.github.ai + github headers"
          curl -s -w "\nhttp=%{http_code}\n" https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" -d "$BODY" | head -c 600; echo
          echo "== B: models.github.ai plain"
          curl -s -w "\nhttp=%{http_code}\n" https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$BODY" | head -c 600; echo
          echo "== C: azure endpoint"
          curl -s -w "\nhttp=%{http_code}\n" https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Reply with JSON {\"ok\":true}"}],"response_format":{"type":"json_object"}}' | head -c 600; echo
          echo "== D: catalog"
          curl -s -w "\nhttp=%{http_code}\n" https://models.github.ai/catalog/models -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" | head -c 400; echo
          echo "== E: org-less api.github.com path"
          curl -s -w "\nhttp=%{http_code}\n" https://api.github.com/models/inference/chat/completions 2>/dev/null \
            -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$BODY" | head -c 300; echo
