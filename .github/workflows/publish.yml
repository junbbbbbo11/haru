# 하루 한 장 — 매일 아침 자동 발행
#
# GitHub cron은 UTC(영국 시간) 기준입니다. 한국 시간 = UTC + 9시간.
#   "*/20 20-23 * * *"  →  UTC 20:00~23:40 20분마다  =  한국 05:00~08:40 20분마다
# GitHub의 예약 실행은 새 저장소일수록 몇 시간씩 늦거나 아예 빠지기도 해서, 아침 내내 여러 번 시도합니다.
# 그날 아침 호(05시 이후 생성)가 이미 있으면 나머지 시도는 20초 만에 건너뜁니다.

name: 하루 한 장 발행

on:
  schedule:
    - cron: "*/20 20-23 * * *"
  workflow_dispatch:          # Actions 탭의 "Run workflow" 버튼 (언제든 수동 발행)
    inputs:
      no_ai:
        description: "AI 없이 원문 헤드라인으로 발행"
        type: boolean
        default: false
      refresh_only:
        description: "새로 만들지 않고, 이미 발행된 최신 호에 미리보기 사진만 다시 붙여 배포 (AI·수집 안 함)"
        type: boolean
        default: false

permissions:
  contents: write     # data/*.json 을 저장소에 저장
  pages: write        # GitHub Pages 배포
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: 오늘 아침 호가 이미 있는지 확인 (예약 실행일 때만)
        id: check
        run: |
          TODAY=$(date +%F)
          # 새벽 5시 이후에 만든 오늘 호가 있으면 건너뜀 (자정~새벽에 수동으로 만든 호는 아침 발행이 덮어씀)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/$TODAY.json" ] && \
             python3 -c "import json,sys; h=int(json.load(open('data/$TODAY.json'))['generated_at'][11:13]); sys.exit(0 if h >= 5 else 1)"; then
            echo "오늘($TODAY) 아침 호는 이미 발행되었습니다. 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 파이썬 준비
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 라이브러리 설치
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium   # 카드뉴스 촬영용 브라우저
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null  # 한글 글꼴 (웹폰트가 안 받아질 때 대비)

      - name: 오늘 호 만들기
        if: steps.check.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # (선택) 등록하면 유료 OpenAI 사용
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python run.py ${{ inputs.no_ai && '--no-ai' || '' }} ${{ inputs.refresh_only && '--render-only --refresh-previews' || '' }}

      - name: 실행 기록(로그) 보관
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: 카드뉴스 보관 (30일)
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_id }}
          path: site/cards/
          retention-days: 30
          if-no-files-found: ignore

      - name: 오늘 호 데이터를 저장소에 저장
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TODAY=$(date +%F)
          # 이번에 만든 오늘 호 파일을 따로 보관 → 최신 main 위에 얹어서 저장 (같은 날 재발행해도 충돌 없음)
          mkdir -p /tmp/keep
          cp "data/$TODAY.json" /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "/tmp/keep/$TODAY.json" data/ 2>/dev/null || true
            git add data/*.json
            if git diff --cached --quiet; then echo "바뀐 데이터 없음"; break; fi
            git commit -q -m "📰 $TODAY 하루 한 장 발행"
            if git push -q origin HEAD:main; then echo "저장 완료"; break; fi
            echo "push 실패($i) → 다시 시도"; sleep 5
          done

      - name: Pages 설정
        if: steps.check.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: 웹페이지 올리기
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: GitHub Pages 배포
        if: steps.check.outputs.skip != 'true'
        id: deploy
        uses: actions/deploy-pages@v4
