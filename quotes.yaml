# ─────────────────────────────────────────────────────────────
#  오늘의 명언 목록 — 날짜에 따라 하나씩 돌아가며 실립니다.
#  · 저작권이 끝난 고전 인물의 말을 우리말로 옮긴 것만 넣었습니다.
#  · 출처가 불분명한 '인터넷 명언'은 일부러 뺐습니다.
#  · 추가하려면 아래 형식(text / author / work)을 복사해서 붙이세요.
# ─────────────────────────────────────────────────────────────
quotes:
  - text: 배우고 때때로 익히면 또한 기쁘지 아니한가.
    author: 공자
    work: 논어
  - text: 아는 것을 안다 하고, 모르는 것을 모른다 하는 것. 그것이 아는 것이다.
    author: 공자
    work: 논어
  - text: 세 사람이 길을 가면 그중에 반드시 나의 스승이 있다.
    author: 공자
    work: 논어
  - text: 지나침은 미치지 못함과 같다.
    author: 공자
    work: 논어
  - text: 군자는 어울리되 같아지지 않는다.
    author: 공자
    work: 논어
  - text: 잘못하고도 고치지 않는 것, 이것을 잘못이라 한다.
    author: 공자
    work: 논어
  - text: 천 리 길도 발밑에서 시작된다.
    author: 노자
    work: 도덕경
  - text: 남을 아는 것은 지혜요, 자신을 아는 것은 밝음이다.
    author: 노자
    work: 도덕경
  - text: 가장 좋은 것은 물과 같다.
    author: 노자
    work: 도덕경
  - text: 사람들은 모두 쓸모 있는 것의 쓸모는 알지만, 쓸모없는 것의 쓸모는 알지 못한다.
    author: 장자
    work: 장자
  - text: 적을 알고 나를 알면 백 번 싸워도 위태롭지 않다.
    author: 손자
    work: 손자병법
  - text: 푸른색은 쪽에서 나왔지만 쪽보다 더 푸르다.
    author: 순자
    work: 순자
  - text: 반드시 죽고자 하면 살고, 반드시 살고자 하면 죽는다.
    author: 이순신
    work: 난중일기
  - text: 성찰하지 않는 삶은 살 가치가 없다.
    author: 소크라테스
    work: 플라톤 『변론』
  - text: 시작이 일의 가장 중요한 부분이다.
    author: 플라톤
    work: 국가
  - text: 제비 한 마리가 봄을 만들지는 않는다.
    author: 아리스토텔레스
    work: 니코마코스 윤리학
  - text: 같은 강물에 두 번 발을 담글 수는 없다.
    author: 헤라클레이토스
    work: 단편
  - text: 너 자신을 알라.
    author: 델포이 신전의 격언
    work: ""
  - text: 인생은 짧고 예술은 길다.
    author: 히포크라테스
    work: 잠언
  - text: 오늘을 붙잡아라. 내일은 최대한 적게 믿고.
    author: 호라티우스
    work: 송가
  - text: 삶이 짧은 것이 아니라, 우리가 많은 시간을 허비하는 것이다.
    author: 세네카
    work: 인생의 짧음에 관하여
  - text: 우리는 현실보다 상상 속에서 더 자주 괴로워한다.
    author: 세네카
    work: 루킬리우스에게 보내는 편지
  - text: 사람을 괴롭히는 것은 일 그 자체가 아니라 그 일에 대한 생각이다.
    author: 에픽테토스
    work: 엥케이리디온
  - text: 우리의 삶은 우리의 생각이 만들어 가는 것이다.
    author: 마르쿠스 아우렐리우스
    work: 명상록
  - text: 가장 좋은 복수는 그와 같은 사람이 되지 않는 것이다.
    author: 마르쿠스 아우렐리우스
    work: 명상록
  - text: 나는 무엇을 아는가?
    author: 몽테뉴
    work: 수상록
  - text: 인간은 생각하는 갈대다.
    author: 파스칼
    work: 팡세
  - text: 나는 생각한다, 그러므로 나는 존재한다.
    author: 데카르트
    work: 방법서설
  - text: 그래도 우리는 우리의 밭을 가꾸어야 합니다.
    author: 볼테르
    work: 캉디드
  - text: 감히 알려고 하라. 너 자신의 지성을 사용할 용기를 가져라.
    author: 칸트
    work: 계몽이란 무엇인가
  - text: 서두르지 말되, 쉬지도 말라.
    author: 괴테
    work: ""
  - text: 오늘 할 수 있는 일을 내일로 미루지 마라.
    author: 벤저민 프랭클린
    work: ""
  - text: 일찍 자고 일찍 일어나면 건강하고 부유하고 현명해진다.
    author: 벤저민 프랭클린
    work: 가난한 리처드의 달력
  - text: 준비가 전부다.
    author: 셰익스피어
    work: 햄릿
  - text: 끝이 좋으면 다 좋다.
    author: 셰익스피어
    work: 끝이 좋으면 다 좋아
  - text: 꿈꾸는 방향으로 자신 있게 나아가라.
    author: 헨리 데이비드 소로
    work: 월든
  - text: 자기 자신을 믿는 것이 성공의 첫 번째 비결이다.
    author: 랄프 왈도 에머슨
    work: 성공
  - text: 용기란 두려움이 없는 것이 아니라, 두려움을 다스리는 것이다.
    author: 마크 트웨인
    work: 얼간이 윌슨
  - text: 나를 죽이지 못하는 것은 나를 더 강하게 만든다.
    author: 니체
    work: 우상의 황혼
  - text: 멀리서 벗이 찾아오니 또한 즐겁지 아니한가.
    author: 공자
    work: 논어
